<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
</head>
<style>
    .heading{
        color:white
    }
    .text-white{
        color:white
    }
    .nav-link:hover{
    color:#60A5FA !important;
    transition:0.3s;
    }
    .navbar-brand:hover{
        color:#FCD34D !important;
    }
</style>
<body style="background-color:black">

    <nav class="navbar navbar-expand-lg" style="background-color:#0F172A; padding:15px;">
    <a class="navbar-brand"
       href="/"
       style="color:#FBBF24; font-size:28px; font-weight:bold;">
        My Book Recommender
    </a>

    <ul class="nav navbar-nav ms-auto">
        <li class="nav-item">
            <a class="nav-link"
               href="/"
               style="color:#F8FAFC; font-size:18px;">
                Home
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link"
               href="/recommend"
               style="color:#F8FAFC; font-size:18px;">
                Recommend
            </a>
        </li>
        </ul>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1 class="heading" style="font-size:50px">Top 50 Books</h1>
            </div>

            {% for i in range(book_name|length) %}
                <div class="col-md-3" style="margin-top:50px">
                    <div class="card">
                        <div class="card-body">
                            <img class="card-img-top" src="{{ image[i] }}">
                            <p class="text-white">{{ book_name[i] }}</p>
                            <h4 class="text-white">{{ author[i] }}</h4>
                            <h4 class="text-white">Votes - {{ votes[i] }}</h4>
                            <h4 class="text-white">Rating - {{ rating[i] }}</h4>
                        </div>
                    </div>
                </div>
            {% endfor %}


        </div>
    </div>

</body>
</html>
